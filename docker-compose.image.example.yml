# Mneme service from the released image (Sections 38.7 and 39).
#
# This is a complete service file for a host operator. It runs the published
# image and needs no source checkout. The repository docker-compose.yml is the
# equivalent definition that builds from source. Both files keep the same
# contract: env_file carries ./.env, the environment block holds only the
# container-fixed override set, the mneme_data volume mounts at /app/data,
# and port 3000 is exposed to sibling services but never published to the host.
#
# Replace vX.Y.Z below with the released version tag, or with the digest form
# ghcr.io/steel-experiments/mneme@sha256:<digest>, at install
# time. The release notes record the digest of each published tag. Do not
# point this at the floating latest tag. Migrations are forward-only, so an
# upgrade must be a deliberate operator action, not an automatic pull.
#
# To publish the HTTP endpoints on your own machine for local checks, add a
# ports block to the service:
#     ports:
#       - "127.0.0.1:3000:3000"
# Keep the binding on loopback only. The endpoints carry no host-level
# authentication; put an authenticating proxy in front before you publish
# them on any other interface.
#
# Usage from the directory that holds this file and your .env:
#   docker compose -f docker-compose.image.example.yml config --quiet
#   docker compose -f docker-compose.image.example.yml up -d
services:
  mneme:
    image: ghcr.io/steel-experiments/mneme:vX.Y.Z

    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      HOME: /tmp
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/mneme.sqlite
      PROMPT_DIR: /app/prompts
      DOCS_DIR: /app/docs
      MNEME_CONFIG_PATH: /app/config/mneme.yml
      CHANNEL_POLICY_PATH: /app/config/channel-policy.yml

    volumes:
      - mneme_data:/app/data

    expose:
      - "3000"

    stop_grace_period: 45s

    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

volumes:
  mneme_data:
