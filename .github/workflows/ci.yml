name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Build production image
        run: docker build --tag mneme:ci .

  # Container smoke test (Sections 38.7 and 46.6): build the image, run the
  # compiled fixture entry point inside it with no network and no credentials,
  # against a fresh writable data volume, then restart the same container and
  # volume and require the same result. One leg per published architecture.
  smoke:
    name: Smoke-test container (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AMD64. This is the primary host architecture.
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          # Native ARM64 hosted runner. Free for public repositories, billed
          # when a repository is private; this repository is public before the
          # first workflow run (publication gate, Section 38.7). A native
          # runner gives a real execution signal, not an emulated one.
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The containers below receive no host environment, so no credential can
      # reach them. This step documents that intent (Section 46.6: no Discord or
      # provider credentials) and fails if the job environment ever carries one.
      # It is not a leak test; fixture mode itself refuses to start when
      # DISCORD_TOKEN is set (src/fixture-mode.ts).
      - name: Assert no credentials are present in the job environment
        run: |
          test -z "${DISCORD_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${GOOGLE_API_KEY:-}"

      - name: Build production image
        run: docker build --platform "${{ matrix.platform }}" --tag mneme:ci-smoke .

      - name: Write the fixture report checker
        run: |
          cat > "$RUNNER_TEMP/check-fixture-report.sh" <<'EOF'
          #!/bin/sh
          # Assert a fixture report carries every documented success marker
          # (src/fixture-mode.ts prints this report on stdout).
          set -eu
          report="$1"
          for marker in \
            '"ok": true' \
            '"mode": "fixture"' \
            '"kind": "reviewed"' \
            '"canaryLeakedToOrg": false' \
            '"orgContentVisible": true' \
            '"canaryStored": true' \
            '"integrity": "ok"'
          do
            if ! grep -Fq "$marker" "$report"; then
              echo "check-fixture-report: missing marker $marker in $report" >&2
              exit 1
            fi
          done
          echo "check-fixture-report: all success markers present in $report"
          EOF
          chmod +x "$RUNNER_TEMP/check-fixture-report.sh"

      # The fixture writes its scratch database and backups under os.tmpdir().
      # TMPDIR=/app/data puts that scratch on the data volume, so this run
      # exercises the volume the container contract gives the application
      # (Section 38). The fixture removes its scratch directory when it ends.
      - name: Run fixture mode in the container (first start)
        run: |
          docker volume create mneme-smoke-data
          set +e
          docker run \
            --name mneme-smoke \
            --network none \
            --platform "${{ matrix.platform }}" \
            --mount source=mneme-smoke-data,target=/app/data \
            --env TMPDIR=/app/data \
            mneme:ci-smoke node dist/fixture-mode.js \
            > "$RUNNER_TEMP/first-run-report.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/first-run-report.json"
          test "$code" -eq 0

      - name: Check the first fixture report
        run: '"$RUNNER_TEMP/check-fixture-report.sh" "$RUNNER_TEMP/first-run-report.json"'

      # Write a marker through the image itself, before the restart. After the
      # restart, read it back. This is the only honest way to prove the volume
      # kept its data, because the fixture always deletes its scratch directory.
      - name: Seed a restart marker on the data volume
        run: |
          docker run --rm --network none --platform "${{ matrix.platform }}" \
            --mount source=mneme-smoke-data,target=/app/data \
            mneme:ci-smoke \
            node -e 'require("node:fs").writeFileSync("/app/data/ci-restart-marker", "present-before-restart")'

      # Restart means: the SAME container, with the SAME command and the SAME
      # volume. docker start replays the entrypoint, so the fixture runs again
      # from a clean scratch directory on a volume that already survived one
      # run.
      - name: Restart the same container and volume
        run: |
          set +e
          docker start --attach mneme-smoke \
            > "$RUNNER_TEMP/restart-report.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/restart-report.json"
          test "$code" -eq 0

      - name: Check the restarted fixture report
        run: '"$RUNNER_TEMP/check-fixture-report.sh" "$RUNNER_TEMP/restart-report.json"'

      - name: Assert the restart kept the data on the volume
        run: |
          docker run --rm --network none --platform "${{ matrix.platform }}" \
            --mount source=mneme-smoke-data,target=/app/data \
            mneme:ci-smoke \
            node -e 'const m = require("node:fs").readFileSync("/app/data/ci-restart-marker", "utf8"); if (m !== "present-before-restart") { throw new Error("restart marker lost: " + m); } console.log("restart marker survived the restart")'
